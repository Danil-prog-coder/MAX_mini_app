[project]
name = "navigator-ai-gateway"
version = "0.1.0"
description = "AI Gateway «Навигатора» — единственная точка вызова LLM в системе (тех. ТЗ 1.2, 5)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.52.3,<1.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    # Та же версия, что в Core API: один Redis, одинаковое поведение клиента.
    "redis>=6.4.0,<6.5",
    "structlog>=26.1.0,<27.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
]

[dependency-groups]
dev = [
    "navigator-ai-gateway[test]",
    "ruff>=0.16.3,<1.0.0",
    "mypy>=2.3.1,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator_ai"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "ASYNC", "S", "RUF"]
ignore = [
    "S101",
    # Комментарии и docstring на русском, см. apps/core/pyproject.toml.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # тестовые «секреты» — не секреты

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["navigator_ai", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
