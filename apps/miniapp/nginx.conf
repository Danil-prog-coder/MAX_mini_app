# Отдача статики мини-приложения (тех. ТЗ 8.10).
#
# Про brotli: в официальном образе nginx модуля brotli нет. Включается либо
# сборкой nginx с ngx_brotli, либо предсжатыми файлами и `brotli_static`. Пока
# продового деплоя нет (тех. ТЗ 9.3), включён только gzip.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Имена файлов в assets/ содержат хеш содержимого, поэтому кэшируются
    # навсегда: изменение файла меняет имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html не кэшируется: он и есть точка, где меняются ссылки на assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: неизвестный путь — не 404, а отдача приложения, которое разберёт
    # маршрут само (закольцованная навигация, ТЗ 1.1).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Заголовки безопасности. CSP намеренно не задаётся здесь: мини-приложение
    # работает во WebView мессенджера MAX, а требования платформы к CSP лежат в
    # закрытой документации (тех. ТЗ 9.7) и ещё не сверены.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
