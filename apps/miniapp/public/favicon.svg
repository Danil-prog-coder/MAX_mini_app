<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Логотип из дизайн-хендоффа: круг цвета --color-text с буквой «Н» цвета
    --color-neutral-200. Значения токенов Organic вписаны литералами: файл
    иконки не участвует в каскаде CSS и переменные темы ему недоступны.
  -->
  <circle cx="16" cy="16" r="16" fill="#201e1d" />
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    fill="#eee7db"
  >
    Н
  </text>
</svg>
