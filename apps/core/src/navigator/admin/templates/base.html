<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · Навигатор</title>
    <style>
      /* Токены дизайн-системы Organic — те же, что в мини-приложении.
         Админка не обязана быть красивой, но и выглядеть чужой не должна. */
      :root {
        --text: #201e1d;
        --accent: #c67139;
        --accent-200: #ffe1d0;
        --accent-700: #8c491a;
        --sand-200: #eee7db;
        --sand-400: #c0b6a5;
        --sand-600: #82796a;
        --sand-700: #645c50;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 24px 64px;
        background: var(--sand-200);
        color: var(--text);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
      nav { display: flex; gap: 12px; margin: 20px 0 28px; flex-wrap: wrap; }
      nav a {
        padding: 10px 16px;
        border: 1.5px solid var(--sand-400);
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
      }
      nav a[aria-current='page'] { background: var(--text); color: var(--sand-200); border-color: var(--text); }
      .card {
        border: 1.5px solid var(--sand-400);
        border-radius: 20px;
        padding: 18px 20px;
        margin-bottom: 12px;
        background: transparent;
      }
      .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--sand-600); }
      .meta { font-size: 12px; color: var(--sand-600); margin-top: 6px; }
      .body { margin: 8px 0 0; white-space: pre-wrap; }
      .note { background: var(--accent-200); border-radius: 14px; padding: 12px 14px; font-size: 13px; }
      textarea, input[type='text'] {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid var(--sand-400);
        border-radius: 14px;
        background: transparent;
        font: inherit;
        color: inherit;
        resize: vertical;
      }
      .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      button {
        padding: 11px 18px;
        border: 0;
        border-radius: 999px;
        background: var(--text);
        color: var(--sand-200);
        font: inherit;
        cursor: pointer;
      }
      button.accent { background: var(--accent); color: var(--text); }
      button.outline { background: transparent; border: 1.5px solid var(--sand-400); color: var(--text); }
      .empty { color: var(--sand-700); }
      .flash { margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <div class="meta">{{ subtitle }}</div>

      <nav>
        <a href="/tickets" {% if section == 'tickets' %}aria-current="page"{% endif %}>
          Обращения ({{ counts.tickets }})
        </a>
        <a href="/questions" {% if section == 'questions' %}aria-current="page"{% endif %}>
          Спорные вопросы ({{ counts.questions }})
        </a>
      </nav>

      {% if flash %}<div class="note flash">{{ flash }}</div>{% endif %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
