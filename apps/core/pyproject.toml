[project]
name = "navigator-core"
version = "0.1.0"
description = "Core API «Навигатора» — модульный монолит и его Celery-воркер (тех. ТЗ 1.1, 1.3)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.52.3,<1.0.0",
    "tortoise-orm[asyncpg]>=1.1.8,<2.0.0",
    "aerich[toml,asyncpg]>=0.10.0,<1.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    # Верхняя граница — не наша осторожность, а требование kombu[redis]:
    # транспорт Celery ещё не поддерживает redis-py 6.5+. Поднимать вместе с kombu.
    "redis>=6.4.0,<6.5",
    "celery[redis]>=5.6.3,<6.0.0",
    "httpx>=0.28.1,<1.0.0",
    "structlog>=26.1.0,<27.0.0",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
# Держим отдельно от dev-группы: тесты запускаются и в образе тоже.
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
]

[dependency-groups]
dev = [
    "navigator-core[test]",
    "ruff>=0.16.3,<1.0.0",
    "mypy>=2.3.1,<3.0.0",
    "celery-types>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

# ─── Tortoise ORM: конфигурация для CLI миграций aerich ──────────────────────
# Первая миграция создаётся вместе с первым доменом, у которого есть модели
# (домен users). До этого список моделей пуст — это нормально, см. CONTRIBUTING.
[tool.aerich]
tortoise_orm = "navigator.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"

# ─── линтер и форматтер ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Миграции генерирует aerich — форматировать и линтовать чужой вывод незачем.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit
    "RUF",      # правила самого ruff
]
ignore = [
    "S101",     # assert — нормален в тестах и в архитектурных проверках
    # Код и комментарии в проекте на русском: правила «похожих» символов дают
    # ложные срабатывания на каждой кириллической букве.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # тестовые «секреты» — не секреты

# ─── типы ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["navigator", "tests"]

[[tool.mypy.overrides]]
module = ["tortoise.*", "aerich.*"]
ignore_missing_imports = true

# ─── тесты ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "integration: требует поднятых Postgres и Redis (см. tests/conftest.py)",
]
